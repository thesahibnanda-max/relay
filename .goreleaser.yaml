# GoReleaser configuration: `goreleaser release --clean` on a version tag.
# Relay is a single static binary (pure-Go SQLite, no cgo) for Linux, macOS and Windows.
version: 2

project_name: relay

before:
  hooks:
    - go vet ./...
    - ./scripts/notices.sh

builds:
  - id: relay
    main: .
    binary: relay
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/thesahibnanda-max/relay/internal/cli.Version={{ .Version }} -X github.com/thesahibnanda-max/relay/internal/cli.builtinServerURL={{ .Env.RELAY_BASE_URL }}

archives:
  - id: relay
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "relay_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - THIRD_PARTY_NOTICES.md
      - NOTICE.md
      - README.md
      - docs/*.md

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

release:
  footer: |
    ## Install

    **macOS, Linux and WSL: one line** (picks the right build, checks it, adds it to your PATH):

    ```sh
    curl -fsSL https://relay-sahib-nanda.vercel.app/install.sh | bash
    ```

    To install exactly this version: `curl -fsSL https://relay-sahib-nanda.vercel.app/install.sh | RELAY_VERSION={{ .Tag }} bash`

    **Windows: one line** (PowerShell — picks the right build, checks it, adds it to your PATH):

    ```powershell
    irm https://relay-sahib-nanda.vercel.app/install.ps1 | iex
    ```

    To install exactly this version: `$env:RELAY_VERSION="{{ .Tag }}"; irm https://relay-sahib-nanda.vercel.app/install.ps1 | iex`

    Then open a new terminal and run `relay doctor`.

    Then try it: `relay claude orchestrator --session=NEW --name=lead` in one terminal, `relay codex
    developer --session=<token it printed> --name=coder` in another — no server to set up, it connects to
    Relay's hosted session server automatically.

    **By hand** (same steps the script does):

    1. Download the file for your machine below (WSL uses the `linux` one):

       | Your machine | File |
       |---|---|
       | Mac with Apple chip (M1/M2/M3/M4) | `relay_{{ .Version }}_darwin_arm64.tar.gz` |
       | Mac with Intel chip | `relay_{{ .Version }}_darwin_amd64.tar.gz` |
       | Linux or WSL, Intel/AMD | `relay_{{ .Version }}_linux_amd64.tar.gz` |
       | Linux or WSL, ARM | `relay_{{ .Version }}_linux_arm64.tar.gz` |

    2. Unpack it and put `relay` in a folder on your PATH:

       ```sh
       mkdir -p ~/.local/bin
       tar -xzf relay_{{ .Version }}_*.tar.gz relay
       mv relay ~/.local/bin/
       ```

    3. Make sure `~/.local/bin` is on your PATH (skip if `relay version` already works):

       ```sh
       # zsh (default on macOS):
       echo 'export PATH="$HOME/.local/bin:$PATH"' >> ~/.zshrc
       # bash on Linux/WSL:
       echo 'export PATH="$HOME/.local/bin:$PATH"' >> ~/.bashrc
       # bash on macOS:
       echo 'export PATH="$HOME/.local/bin:$PATH"' >> ~/.bash_profile
       ```

       Then open a new terminal and run `relay version`.

    On a Mac, a file downloaded in a browser may be blocked as "from an unidentified developer".
    Run `xattr -d com.apple.quarantine ~/.local/bin/relay` once to allow it (the one-line install is not affected).

    **Windows, by hand:** download `relay_{{ .Version }}_windows_amd64.zip` (Intel/AMD) or
    `relay_{{ .Version }}_windows_arm64.zip` (ARM), extract `relay.exe` into a folder of your choice, then add
    that folder to your PATH: `[Environment]::SetEnvironmentVariable("Path", "$env:Path;C:\path\to\folder", "User")`.
    Then open a new terminal and run `relay version`.

    Optional check: `sha256sum -c --ignore-missing checksums.txt` on Linux/WSL, or
    `grep relay_{{ .Version }}_darwin_arm64.tar.gz checksums.txt | shasum -a 256 -c -` on a Mac.

    **Remove it:** delete `~/.local/bin/relay`, and the `# added by relay installer` line from your shell startup file.
    On Windows, delete `%LOCALAPPDATA%\relay` and remove it from your PATH.

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
