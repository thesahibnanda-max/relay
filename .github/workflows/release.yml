name: release

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "ui/**", "vercel.json"]   # docs and website changes don't release the CLI

permissions:
  contents: write

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: next version
        id: v
        run: |
          last=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          last=${last:-v0.0.0}
          IFS=. read -r maj min pat <<<"${last#v}"
          echo "tag=v$maj.$min.$((pat+1))" >> "$GITHUB_OUTPUT"
      - name: tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git tag ${{ steps.v.outputs.tag }}
          git push origin ${{ steps.v.outputs.tag }}
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELAY_BASE_URL: ${{ secrets.RELAY_BASE_URL }}
