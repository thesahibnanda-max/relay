name: ci

# Runs on pull requests only: main accepts nothing but PRs whose checks passed,
# so the release workflow does not test again after the merge.
on:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash # windows-latest ships Git Bash; every step below is POSIX shell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: format
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: "vet other platforms (editors analyse them too)"
        run: make vet-all
      # Includes the blocking zero-footprint test: it hashes a fake ~/.claude,
      # ~/.codex and project dir around a full two-agent session.
      - name: test (race)
        if: runner.os != 'Windows'
        run: go test -race -count=1 ./...
      # The race detector needs a native cgo C toolchain relay does not
      # otherwise depend on; Windows still gets the full, real suite run
      # natively (not cross-compiled), just without -race.
      - name: test
        if: runner.os == 'Windows'
        run: go test -count=1 ./...

  cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make cross

  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make fuzz FUZZTIME=10s

  # Website tests (ui/). Runs on every PR, with no path filter, so it can be a required check.
  ui-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      # chromium + webkit are downloaded; the "chrome" project uses the Chrome already on the runner.
      - run: npx playwright install --with-deps chromium webkit
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ui-test-report
          path: ui/playwright-report
          retention-days: 7
